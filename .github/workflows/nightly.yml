name: Nightly

on:
  push:
    branches: [PM5]

jobs:
  build:
    uses: axolotl-pm/pmmp-plugin-actions/.github/workflows/build-phar.yml@main
    with:
      php-version: '8.2'
      stage-poggit: true
    permissions:
      contents: write  # Required because `stage-poggit: true`

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: axolotl-pm/pmmp-plugin-actions/publish-nightly@main
        with:
          artifact-id:    ${{ needs.build.outputs.artifact-id }}
          plugin-name:    ${{ needs.build.outputs.plugin-name }}
          plugin-version: ${{ needs.build.outputs.plugin-version }}
          pm-version:     ${{ needs.build.outputs.pm-version }}
