name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'    # v1.0.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'  # v1.0.0-beta.1, v1.0.0-rc.1
      - '[0-9]+.[0-9]+.[0-9]+'     # 1.0.0
      - '[0-9]+.[0-9]+.[0-9]+-*'   # 1.0.0-beta.1, 1.0.0-rc.1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: axolotl-pm/pmmp-plugin-actions/validate-release@main

  build:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      plugin-name:   ${{ steps.build.outputs.plugin-name }}
      pm-version:    ${{ steps.build.outputs.pm-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: axolotl-pm/pmmp-plugin-actions/build-phar@main
        id: build
        with:
          php-version: '8.2'

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: axolotl-pm/pmmp-plugin-actions/publish-release@main
        with:
          artifact-name: ${{ needs.build.outputs.artifact-name }}
          plugin-name:   ${{ needs.build.outputs.plugin-name }}
          pm-version:    ${{ needs.build.outputs.pm-version }}
